<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Alphabet russe</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: #1e293b;
        display: flex;
        justify-content: center;
        padding: 30px 15px;
    }

    .container {
        width: 100%;
        max-width: 850px;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        border-radius: 18px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h2 {
        margin-top: 0;
    }

    .letters {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
        gap: 10px;
        margin-top: 20px;
    }

    .letter-btn {
        height: 65px;
        border: 2px solid #e2e8f0;
        background: #f8fafc;
        border-radius: 12px;
        font-size: 28px;
        cursor: pointer;
        transition: 0.15s;
    }

    .letter-btn:hover {
        border-color: #6366f1;
        transform: translateY(-2px);
    }

    .letter-btn.selected {
        background: #6366f1;
        border-color: #6366f1;
        color: white;
    }

    .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 20px;
    }

    button.action {
        border: none;
        padding: 12px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    }

    .primary {
        background: #4f46e5;
        color: white;
    }

    .secondary {
        background: #e2e8f0;
        color: #334155;
    }

    .quiz {
        display: none;
        text-align: center;
    }

    .progress {
        color: #64748b;
        margin-bottom: 15px;
    }

    .big-letter {
        font-size: 110px;
        font-weight: bold;
        margin: 15px 0 25px;
        color: #312e81;
    }

    .answer {
        width: 100%;
        max-width: 400px;
        padding: 15px;
        font-size: 20px;
        border: 2px solid #cbd5e1;
        border-radius: 10px;
        text-align: center;
        outline: none;
    }

    .answer:focus {
        border-color: #6366f1;
    }

    .feedback {
        min-height: 30px;
        margin: 15px 0;
        font-size: 18px;
        font-weight: bold;
    }

    .correct {
        color: #16a34a;
    }

    .incorrect {
        color: #dc2626;
    }

    .score {
        font-size: 18px;
        margin-top: 15px;
    }

    .result {
        display: none;
        text-align: center;
    }

    .result-score {
        font-size: 48px;
        font-weight: bold;
        color: #4f46e5;
        margin: 20px 0;
    }

    .hint {
        color: #64748b;
        font-size: 14px;
        margin-top: 10px;
    }

    .select-all {
        margin-top: 15px;
        color: #4f46e5;
        cursor: pointer;
        font-weight: bold;
    }

    @media (max-width: 500px) {
        .big-letter {
            font-size: 85px;
        }

        .letters {
            grid-template-columns: repeat(5, 1fr);
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>🇷🇺 Alphabet russe</h1>
    <div class="subtitle">
        Choisis les lettres que tu veux apprendre, puis donne leur prononciation.
    </div>

    <!-- Sélection des lettres -->
    <div class="card" id="selectionCard">

        <h2>1. Choisis les lettres</h2>

        <div class="letters" id="lettersContainer"></div>

        <div class="select-all" onclick="selectAll()">
            Tout sélectionner
        </div>

        <div class="actions">
            <button class="action primary" onclick="startQuiz()">
                Commencer le quiz
            </button>

            <button class="action secondary" onclick="clearSelection()">
                Effacer la sélection
            </button>
        </div>

        <p class="hint">
            Astuce : tu peux commencer avec seulement quelques lettres.
        </p>
    </div>

    <!-- Quiz -->
    <div class="card quiz" id="quizCard">

        <div class="progress" id="progress"></div>

        <div class="big-letter" id="currentLetter"></div>

        <input
            type="text"
            id="answer"
            class="answer"
            placeholder="Écris la prononciation"
            autocomplete="off"
            spellcheck="false"
        >

        <div class="feedback" id="feedback"></div>

        <button class="action primary" id="checkButton" onclick="checkAnswer()">
            Vérifier
        </button>

        <div class="score" id="score"></div>
    </div>

    <!-- Résultat -->
    <div class="card result" id="resultCard">

        <h2>Quiz terminé !</h2>

        <div class="result-score" id="finalScore"></div>

        <p id="finalMessage"></p>

        <div class="actions" style="justify-content:center;">
            <button class="action primary" onclick="restartQuiz()">
                Recommencer
            </button>

            <button class="action secondary" onclick="backToSelection()">
                Changer les lettres
            </button>
        </div>
    </div>

</div>

<script>

const russianAlphabet = [
    { letter: "А", pronunciation: ["a"] },
    { letter: "Б", pronunciation: ["b"] },
    { letter: "В", pronunciation: ["v"] },
    { letter: "Г", pronunciation: ["g"] },
    { letter: "Д", pronunciation: ["d"] },
    { letter: "Е", pronunciation: ["ié", "ye", "é"] },
    { letter: "Ё", pronunciation: ["yo", "io"] },
    { letter: "Ж", pronunciation: ["j", "zh"] },
    { letter: "З", pronunciation: ["z"] },
    { letter: "И", pronunciation: ["i"] },
    { letter: "Й", pronunciation: ["ï", "y"] },
    { letter: "К", pronunciation: ["k"] },
    { letter: "Л", pronunciation: ["l"] },
    { letter: "М", pronunciation: ["m"] },
    { letter: "Н", pronunciation: ["n"] },
    { letter: "О", pronunciation: ["o"] },
    { letter: "П", pronunciation: ["p"] },
    { letter: "Р", pronunciation: ["r"] },
    { letter: "С", pronunciation: ["s"] },
    { letter: "Т", pronunciation: ["t"] },
    { letter: "У", pronunciation: ["ou", "u"] },
    { letter: "Ф", pronunciation: ["f"] },
    { letter: "Х", pronunciation: ["kh", "h"] },
    { letter: "Ц", pronunciation: ["ts", "c"] },
    { letter: "Ч", pronunciation: ["tch", "ch"] },
    { letter: "Ш", pronunciation: ["ch", "sh"] },
    { letter: "Щ", pronunciation: ["chtch", "shch"] },
    { letter: "Ъ", pronunciation: ["signe dur", "dur"] },
    { letter: "Ы", pronunciation: ["y", "i dur"] },
    { letter: "Ь", pronunciation: ["signe mou", "mou"] },
    { letter: "Э", pronunciation: ["è", "e"] },
    { letter: "Ю", pronunciation: ["you", "yu"] },
    { letter: "Я", pronunciation: ["ia", "ya"] }
];

let selectedLetters = [];
let quizLetters = [];
let currentIndex = 0;
let score = 0;
let answered = false;

const lettersContainer = document.getElementById("lettersContainer");


// --------------------------------------------------
// Création des boutons de lettres
// --------------------------------------------------

russianAlphabet.forEach(item => {

    const button = document.createElement("button");

    button.className = "letter-btn";
    button.textContent = item.letter;
    button.dataset.letter = item.letter;

    button.onclick = () => {

        button.classList.toggle("selected");

        if (selectedLetters.includes(item.letter)) {

            selectedLetters =
                selectedLetters.filter(l => l !== item.letter);

        } else {

            selectedLetters.push(item.letter);
        }
    };

    lettersContainer.appendChild(button);
});


// --------------------------------------------------
// Sélection
// --------------------------------------------------

function selectAll() {

    selectedLetters = russianAlphabet.map(item => item.letter);

    document.querySelectorAll(".letter-btn")
        .forEach(button => button.classList.add("selected"));
}


function clearSelection() {

    selectedLetters = [];

    document.querySelectorAll(".letter-btn")
        .forEach(button => button.classList.remove("selected"));
}


// --------------------------------------------------
// Démarrer le quiz
// --------------------------------------------------

function startQuiz() {

    if (selectedLetters.length === 0) {

        alert("Sélectionne au moins une lettre.");

        return;
    }

    quizLetters = russianAlphabet.filter(item =>
        selectedLetters.includes(item.letter)
    );

    // Mélange aléatoire
    quizLetters.sort(() => Math.random() - 0.5);

    currentIndex = 0;
    score = 0;

    document.getElementById("selectionCard").style.display = "none";
    document.getElementById("resultCard").style.display = "none";
    document.getElementById("quizCard").style.display = "block";

    showLetter();
}


// --------------------------------------------------
// Afficher une lettre
// --------------------------------------------------

function showLetter() {

    answered = false;

    const item = quizLetters[currentIndex];

    document.getElementById("currentLetter").textContent =
        item.letter;

    document.getElementById("progress").textContent =
        `Lettre ${currentIndex + 1} / ${quizLetters.length}`;

    document.getElementById("score").textContent =
        `Score : ${score} / ${currentIndex}`;

    const answer = document.getElementById("answer");

    answer.value = "";
    answer.disabled = false;
    answer.focus();

    document.getElementById("feedback").textContent = "";

    document.getElementById("checkButton").textContent =
        "Vérifier";
}


// --------------------------------------------------
// Vérifier la réponse
// --------------------------------------------------

function checkAnswer() {

    if (answered) {

        nextLetter();

        return;
    }

    const input =
        document.getElementById("answer").value
            .trim()
            .toLowerCase();

    if (!input) {

        return;
    }

    const item = quizLetters[currentIndex];

    const accepted =
        item.pronunciation.map(p =>
            normalize(p)
        );

    const userAnswer = normalize(input);

    const feedback =
        document.getElementById("feedback");

    if (accepted.includes(userAnswer)) {

        score++;

        feedback.textContent = "✓ Correct !";
        feedback.className = "feedback correct";

    } else {

        feedback.textContent =
            "✗ Réponse attendue : " +
            item.pronunciation.join(" / ");

        feedback.className = "feedback incorrect";
    }

    answered = true;

    document.getElementById("answer").disabled = true;

    document.getElementById("checkButton").textContent =
        currentIndex === quizLetters.length - 1
            ? "Voir le résultat"
            : "Lettre suivante";

    document.getElementById("score").textContent =
        `Score : ${score} / ${currentIndex + 1}`;
}


// --------------------------------------------------
// Lettre suivante
// --------------------------------------------------

function nextLetter() {

    currentIndex++;

    if (currentIndex >= quizLetters.length) {

        showResult();

    } else {

        showLetter();
    }
}


// --------------------------------------------------
// Résultat
// --------------------------------------------------

function showResult() {

    document.getElementById("quizCard").style.display = "none";
    document.getElementById("resultCard").style.display = "block";

    const percentage =
        Math.round((score / quizLetters.length) * 100);

    document.getElementById("finalScore").textContent =
        `${score} / ${quizLetters.length}`;

    let message;

    if (percentage === 100) {

        message = "Parfait ! Tu maîtrises toutes les lettres sélectionnées.";

    } else if (percentage >= 80) {

        message = "Très bien ! Encore quelques révisions et ce sera solide.";

    } else if (percentage >= 50) {

        message = "Bon début ! Rejoue avec les lettres que tu confonds.";

    } else {

        message = "Continue à pratiquer : la répétition va t'aider à mémoriser.";

    }

    document.getElementById("finalMessage").textContent = message;
}


// --------------------------------------------------
// Recommencer avec les mêmes lettres
// --------------------------------------------------

function restartQuiz() {

    startQuiz();
}


// --------------------------------------------------
// Retour à la sélection
// --------------------------------------------------

function backToSelection() {

    document.getElementById("resultCard").style.display = "none";
    document.getElementById("selectionCard").style.display = "block";
}


// --------------------------------------------------
// Normalisation des réponses
// --------------------------------------------------

function normalize(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


// --------------------------------------------------
// Touche Entrée
// --------------------------------------------------

document.getElementById("answer").addEventListener("keydown", event => {

    if (event.key === "Enter") {

        checkAnswer();
    }
});

</script>

</body>
</html>
